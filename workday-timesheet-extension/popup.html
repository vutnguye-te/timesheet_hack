<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workday Autofill</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 12px;
        width: 360px;
        color: #1d1d1f;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .block {
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }
      input[type="file"],
      textarea {
        width: 100%;
        box-sizing: border-box;
      }
      textarea {
        min-height: 80px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        border: 1px solid #444;
        padding: 7px 10px;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      .status {
        font-size: 12px;
        white-space: pre-wrap;
      }
      .ok {
        color: #0a7f2e;
      }
      .warn {
        color: #a05a00;
      }
      .err {
        color: #c21d1d;
      }
      .note {
        font-size: 11px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Workday Draft Autofill</h1>

    <div class="block">
      <label for="payloadFile">Upload PD output JSON/CSV</label>
      <input id="payloadFile" type="file" />
      <div class="note">Supported: `workday-draft.json`, `workday-ui-plan.json`, `rpa-queue.json`, CSV.</div>
    </div>

    <div class="block">
      <label for="customSelectors">Custom selectors JSON (optional)</label>
      <textarea id="customSelectors" placeholder='{"dateInput":"...", "hoursInput":"..."}'></textarea>
    </div>

    <div class="block row">
      <select id="pickField">
        <option value="dateInput">dateInput</option>
        <option value="hoursInput">hoursInput</option>
        <option value="timeTypeInput">timeTypeInput</option>
        <option value="memoInput">memoInput</option>
        <option value="addRowButton">addRowButton</option>
        <option value="saveButton">saveButton</option>
      </select>
      <button id="pickBtn">Pick Selector</button>
    </div>

    <div class="block row">
      <input id="dryRun" type="checkbox" checked />
      <label for="dryRun" style="margin: 0">Dry run (highlight only, no save)</label>
    </div>

    <div class="block row">
      <button id="previewBtn">Preview Entries</button>
      <button id="scanBtn">Scan Page</button>
      <button id="fillBtn" class="primary">Fill Draft</button>
    </div>

    <div id="status" class="status warn">Open your Workday timesheet tab before running.</div>

    <script src="popup.js"></script>
  </body>
</html>
